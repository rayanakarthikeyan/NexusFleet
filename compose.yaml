services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: nexusfleet
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - fleet-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d nexusfleet']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fleet-data:
